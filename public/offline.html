<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a2e23" />
    <title>Brak internetu · Metando</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: #0f3b2e;
        color: #f3ead3;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 28px;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0 auto;
        max-width: 320px;
        color: #b9cfc3;
        line-height: 1.5;
      }
      button {
        margin-top: 20px;
        height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: #ff7a1a;
        color: #13261f;
        font-weight: 800;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.025em;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Metando" />
      <h1>Brak internetu</h1>
      <p>Metando potrzebuje połączenia, żeby pokazać aktualne spotkania. Sprawdź sieć i spróbuj ponownie.</p>
      <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
    </main>
  </body>
</html>
