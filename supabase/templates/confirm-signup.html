<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Potwierdź konto w Metando</title>
  </head>
  <body style="margin: 0; background: #0f3b2e; font-family: Arial, Helvetica, sans-serif; color: #13241c">
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #0f3b2e; padding: 24px 12px"
    >
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 520px">
            <tr>
              <td style="padding: 0 4px 14px; font-size: 22px; font-weight: 800; font-style: italic; color: #ff7a1a">
                METANDO
              </td>
            </tr>
            <tr>
              <td style="background: #f2ead6; border-radius: 20px; padding: 24px">
                <h1 style="margin: 0 0 8px; font-size: 24px; line-height: 1.15">Potwierdź swój adres e-mail</h1>
                <p style="margin: 0 0 20px; font-size: 15px; line-height: 1.5; color: #3d4a42">
                  Jeszcze jeden krok: kliknij przycisk, żeby aktywować konto i dołączać do spotkań.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    background: #ff7a1a;
                    color: #13241c;
                    text-decoration: none;
                    font-weight: 800;
                    font-size: 14px;
                    letter-spacing: 0.5px;
                    text-transform: uppercase;
                    padding: 13px 22px;
                    border-radius: 999px;
                  "
                  >Potwierdź konto</a
                >
                <p style="margin: 20px 0 0; font-size: 12px; line-height: 1.5; color: #6b756f">
                  Jeśli to nie Ty zakładałeś konto w Metando, zignoruj tę wiadomość — bez kliknięcia konto nie zostanie
                  aktywowane.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 4px; font-size: 12px; color: #a9c2b4">
                Metando · <a href="https://metando.pl" style="color: #d9e7de">metando.pl</a> · kontakt@metando.pl
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
